[pytest]
# Pytest configuration for AutoRange Cyber Range tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Minimum Python version
minversion = 7.0

# Add options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security feature tests
    slow: Slow running tests
